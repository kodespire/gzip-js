# Builds example/react-native against the package as npm would publish it and runs
# its self-test (selftest/run.ts) on an iOS simulator and an Android emulator.
# The WebAssembly module comes from the shared build-wasm workflow because
# scripts/build-ts.mjs copies it into dist/.
name: React Native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    uses: kodespire/compression-js/.github/workflows/build-wasm.yml@v1
    with:
      wasm-build: node scripts/build-wasm.mjs
      wasm-artifact-path: out/wasm

  ios:
    name: iOS simulator
    needs: wasm
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: example/react-native
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: out/wasm
      - name: Build the package
        working-directory: .
        run: npm ci && npm run build:ts
      - name: Install the example (packs the package into node_modules)
        run: npm ci
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: example/react-native
      - name: Install pods
        run: bundle install && cd ios && bundle exec pod install
      - name: Self-test
        run: node scripts/selftest.mjs ios

  android:
    name: Android emulator
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: example/react-native
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: out/wasm
      - name: Build the package
        working-directory: .
        run: npm ci && npm run build:ts
      - name: Install the example (packs the package into node_modules)
        run: npm ci
      - name: Build the app
        working-directory: example/react-native/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --console=plain
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Self-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect
          disable-animations: true
          working-directory: example/react-native
          script: node scripts/selftest.mjs android --skip-build
