name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bash scripts/ci/setup-emsdk.sh
      - run: source ~/emsdk/emsdk_env.sh && node scripts/build-wasm.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: out/wasm/gzip.wasm
          if-no-files-found: error

  node:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: out/wasm
      - run: npm ci
      - run: npm run build:native
      - run: npm run build:ts
      - name: Interop tools (system gzip, Python zlib)
        if: runner.os != 'Windows'
        run: gzip --version | head -1 && python3 -I -c 'import zlib; print("python zlib", zlib.ZLIB_RUNTIME_VERSION)'
      - run: npm test
        env:
          # Linux and macOS runners have gzip and python3: fail instead of skipping those tests.
          REQUIRE_INTEROP: ${{ runner.os != 'Windows' && '1' || '' }}

  browsers:
    name: Browsers (Chromium, Firefox, WebKit)
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: out/wasm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:ts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx vitest run -c vitest.browser.config.ts
        env:
          BROWSERS: chromium,firefox,webkit

  runtimes:
    name: Installed package on Node, Bun, Deno and Workers
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: out/wasm
      - run: npm ci
      - run: npm run build:ts
      - run: bash scripts/ci/prebuild-linux.sh glibc
      - name: Install the packed tarball into an empty project
        run: |
          npm pack
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../kodespire-gzip-js-*.tgz
          cp ../test/smoke/smoke.mjs .
      - name: Node (native)
        working-directory: consumer
        run: EXPECT_BACKEND=native node smoke.mjs
      - name: Node (forced WebAssembly)
        working-directory: consumer
        run: GZIP_JS_BACKEND=wasm EXPECT_BACKEND=wasm node smoke.mjs
      - name: Bun
        working-directory: consumer
        run: EXPECT_BACKEND=native bun smoke.mjs
      - name: Deno
        working-directory: consumer
        run: EXPECT_BACKEND=wasm deno run -A --node-modules-dir=manual smoke.mjs
      - name: Cloudflare Workers (wrangler dev, workerd)
        working-directory: consumer
        timeout-minutes: 5
        run: |
          cp ../test/workerd/worker.mjs ../test/workerd/wrangler.toml ../test/workerd/run.mjs .
          npm install --no-audit --no-fund wrangler@4
          node run.mjs
